plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.9.0'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['android/src/main/java']
        }
    }
}

checkstyle {
    toolVersion = '13.11.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.named('checkstyleMain') {
    classpath = files()
    setDependsOn([])
}

spotless {
    java {
        target 'android/src/main/java/**/*.java'
        googleJavaFormat('1.29.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

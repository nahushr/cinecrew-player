name: Build, quality gates, and publish CineCrew Player

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-cinecrew-player-main
  cancel-in-progress: false

jobs:
  platform-build:
    name: Test package and platform demos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Test package contract and declarations
        run: |
          npm test
          npm run check:types
          npm pack --dry-run

      - name: Install React web demo dependencies
        run: npm ci --prefix examples/web-demo

      - name: Build React web renderer
        run: npm run build --prefix examples/web-demo

      - name: Build Electron renderer entry
        run: npm run build:electron --prefix examples/web-demo

      - name: Install Expo demo dependencies
        run: npm ci --prefix examples/expo-web-demo

      - name: Validate the package's Expo config plugin
        working-directory: examples/expo-web-demo
        run: npx expo config --type prebuild --json > "$RUNNER_TEMP/expo-prebuild-config.json"

      - name: Verify Expo autolinks the bundled native adapter
        working-directory: examples/expo-web-demo
        run: |
          npx expo-modules-autolinking react-native-config --platform android --project-root . --json > "$RUNNER_TEMP/android-autolinking.json"
          npx expo-modules-autolinking react-native-config --platform ios --project-root . --json > "$RUNNER_TEMP/ios-autolinking.json"
          node -e "const fs=require('node:fs');const android=fs.readFileSync(process.argv[1],'utf8');const ios=fs.readFileSync(process.argv[2],'utf8');if(!android.includes('ReactVlcPlayerPackage'))throw new Error('Bundled Android VLC package did not autolink');if(!ios.includes('CineCrewPlayer.podspec'))throw new Error('Bundled iOS VLC podspec did not autolink');console.log('Bundled VLC module autolinks on Android and iOS.')" "$RUNNER_TEMP/android-autolinking.json" "$RUNNER_TEMP/ios-autolinking.json"

      - name: Build Expo Web bundle
        working-directory: examples/expo-web-demo
        run: npx expo export --platform web --output-dir dist-web

      - name: Build React Native Android bundle
        working-directory: examples/expo-web-demo
        run: npx expo export --platform android --output-dir dist-android

      - name: Build React Native iOS bundle
        working-directory: examples/expo-web-demo
        run: npx expo export --platform ios --output-dir dist-ios

  android-build:
    name: Build Android native demo APK
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install native demo dependencies
        run: npm ci --prefix examples/native-demo

      - name: Build Android Release APK
        working-directory: examples/native-demo/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage Android APK artifact
        run: |
          mkdir -p artifacts
          cp examples/native-demo/android/app/build/outputs/apk/release/app-release.apk artifacts/cinecrew-player-demo.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinecrew-player-demo.apk
          path: artifacts/cinecrew-player-demo.apk
          if-no-files-found: error

  quality-gates:
    name: Sonar, Snyk, and Checkstyle
    needs: platform-build
    uses: ./.github/workflows/quality-gates.yml
    secrets: inherit

  publish:
    name: Publish one player package to npm and GitHub Packages
    needs: [platform-build, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up npm registry authentication
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@cinecrew'

      - name: Install package dependencies and increment patch version
        run: |
          set -euo pipefail
          npm ci
          npm version patch --no-git-tag-version --ignore-scripts
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: release

      - name: Publish public npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package="@cinecrew/cinecrew-player@$VERSION"
          registry_cache="$RUNNER_TEMP/npm-release-cache"
          wait_for_npm_version() {
            for attempt in $(seq 1 60); do
              if npm view "$package" version --prefer-online --cache="$registry_cache" \
                --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "$package is visible on npm."
                return 0
              fi
              echo "Waiting for npm to index $package ($attempt/60)."
              sleep 5
            done
            return 1
          }

          if npm view "$package" version --prefer-online --cache="$registry_cache" \
            --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package is already on npm; skipping this registry to make retries safe."
          else
            publish_status=0
            npm publish --access public --registry=https://registry.npmjs.org || publish_status=$?
            if [ "$publish_status" -ne 0 ]; then
              echo "npm publish returned $publish_status; waiting to see whether npm accepted and is indexing $package."
              if wait_for_npm_version; then
                exit 0
              fi
              echo "::error::npm publish failed. Confirm NPM_TOKEN has package publish access and satisfies the account's 2FA requirements."
              exit "$publish_status"
            fi
            wait_for_npm_version || {
              echo "::error::Timed out waiting for $package to appear on npm."
              exit 1
            }
          fi

      - name: Pack the same version for GitHub Packages
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpr"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/gpr"
          tarball=$(find "$RUNNER_TEMP/gpr" -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | head -n 1)
          test -n "$tarball"
          mkdir -p "$RUNNER_TEMP/gpr/package"
          tar -xzf "$RUNNER_TEMP/gpr/$tarball" --strip-components=1 -C "$RUNNER_TEMP/gpr/package"
          npm pkg set name='@nahushr/cinecrew-player' --prefix "$RUNNER_TEMP/gpr/package"

      - name: Set up GitHub Packages authentication
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@nahushr'

      - name: Publish the same version to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        working-directory: ${{ runner.temp }}/gpr/package
        run: |
          set -euo pipefail
          package="@nahushr/cinecrew-player@$VERSION"
          if npm view "$package" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$package is already on GitHub Packages; skipping this registry to make retries safe."
          else
            npm publish --ignore-scripts --registry=https://npm.pkg.github.com
          fi

      - name: Refresh every demo lockfile to the newly published npm package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for demo in examples/web-demo examples/expo-web-demo examples/native-demo examples/electron-demo; do
            updated=false
            for attempt in $(seq 1 12); do
              if npm install --package-lock-only --ignore-scripts --save-exact --prefer-online \
                --cache="$RUNNER_TEMP/npm-release-cache" --prefix "$demo" \
                "@cinecrew/cinecrew-player@$VERSION" --registry=https://registry.npmjs.org; then
                updated=true
                break
              fi
              echo "Retrying $demo lockfile update ($attempt/12)."
              sleep 10
            done
            if [ "$updated" != true ]; then
              echo "::error::Could not refresh $demo to @cinecrew/cinecrew-player@$VERSION."
              exit 1
            fi
            node - "$demo/package-lock.json" "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const [file, expected] = process.argv.slice(2);
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
          const actual = lock.packages?.['node_modules/@cinecrew/cinecrew-player']?.version;
          if (actual !== expected) throw new Error(`${file} resolves ${actual}; expected ${expected}`);
          NODE
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const packageName = '@cinecrew/cinecrew-player';
          const expected = process.env.VERSION;
          const demos = ['web-demo', 'expo-web-demo', 'native-demo', 'electron-demo'];
          for (const name of demos) {
            const root = `examples/${name}`;
            const manifest = JSON.parse(fs.readFileSync(`${root}/package.json`, 'utf8'));
            const lock = JSON.parse(fs.readFileSync(`${root}/package-lock.json`, 'utf8'));
            const declared = manifest.dependencies?.[packageName];
            const locked = lock.packages?.['']?.dependencies?.[packageName];
            const player = lock.packages?.[`node_modules/${packageName}`];
            if (declared?.startsWith('file:') || locked?.startsWith('file:') || player?.resolved?.startsWith('file:')) {
              throw new Error(`${name} still resolves ${packageName} from a local file reference.`);
            }
            if (player?.version !== expected) {
              throw new Error(`${name} lockfile resolves ${player?.version}; expected ${expected}.`);
            }
            if (name === 'native-demo' && (declared !== expected || locked !== expected)) {
              throw new Error(`Native demo must pin ${packageName}@${expected} (manifest: ${declared}; lock: ${locked}).`);
            }
          }
          NODE

      - name: Commit the released version for the next main build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git add examples/web-demo/package.json examples/web-demo/package-lock.json
          git add examples/expo-web-demo/package.json examples/expo-web-demo/package-lock.json
          git add examples/native-demo/package.json examples/native-demo/package-lock.json
          git add examples/electron-demo/package.json examples/electron-demo/package-lock.json
          git commit -m "chore(release): sync package version $VERSION [skip ci]"
          for attempt in $(seq 1 5); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Retrying release commit push after refreshing main ($attempt/5)."
            sleep 2
          done
          echo "::error::Could not push the release version and demo lockfiles to main."
          exit 1

  macos-dmg:
    name: Build Electron LibVLC DMG
    needs: android-build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the released demo setup
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install the Electron demo with the published npm package
        run: npm ci --prefix examples/electron-demo

      - name: Install VLC runtime
        run: brew install --cask vlc

      - name: Package the macOS DMG with LibVLC
        run: npm run dist:mac --prefix examples/electron-demo

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinecrew-player-demo.dmg
          path: examples/electron-demo/release/cinecrew-player-demo.dmg
          if-no-files-found: error

  windows-exe:
    name: Build Electron LibVLC Windows installer
    needs: macos-dmg
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the released demo setup
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install VLC runtime
        run: choco install vlc --yes --no-progress

      - name: Install the Electron demo with the published npm package
        run: npm ci --prefix examples/electron-demo

      - name: Package the Windows EXE with LibVLC
        run: npm run dist:win --prefix examples/electron-demo

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinecrew-player-demo-setup.exe
          path: examples/electron-demo/release/cinecrew-player-demo-setup.exe
          if-no-files-found: error

  release-assets:
    name: Publish APK, DMG, and EXE release assets
    needs: [publish, android-build, macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cinecrew-player-demo.apk
          path: artifacts

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: cinecrew-player-demo.dmg
          path: artifacts

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: cinecrew-player-demo-setup.exe
          path: artifacts

      - name: Publish GitHub Release with all platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" \
              artifacts/cinecrew-player-demo.apk \
              artifacts/cinecrew-player-demo.dmg \
              artifacts/cinecrew-player-demo-setup.exe \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "v$VERSION" \
              artifacts/cinecrew-player-demo.apk \
              artifacts/cinecrew-player-demo.dmg \
              artifacts/cinecrew-player-demo-setup.exe \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "CineCrew Player v$VERSION release with Android APK and Electron LibVLC installers for macOS and Windows." \
              --latest
          fi

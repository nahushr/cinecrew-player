name: Quality Gates

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: SonarCloud, Snyk, and Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Sonar scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-scanner-${{ runner.os }}-5.0.0
          restore-keys: |
            sonar-scanner-${{ runner.os }}-

      - name: Run SonarCloud scan
        id: sonar_scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          set -euo pipefail
          args=(
            -Dproject.settings=sonar-project.properties
            -Dsonar.token="$SONAR_TOKEN"
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(
              "-Dsonar.pullrequest.key=$PR_NUMBER"
              "-Dsonar.pullrequest.branch=$PR_HEAD_REF"
              "-Dsonar.pullrequest.base=$PR_BASE_REF"
            )
          fi
          npx --yes sonarqube-scanner@5.0.0 "${args[@]}"

      - name: Enforce SonarCloud findings and duplication limits
        id: sonar_policy
        if: always() && steps.sonar_scan.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: nahushr_cinecrew-player
          SONAR_BRANCH: ${{ github.ref_name }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          scope=()
          if [[ -n "$SONAR_PULL_REQUEST" ]]; then
            scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          else
            scope+=(--data-urlencode "branch=$SONAR_BRANCH")
          fi

          issues=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=1' "${scope[@]}")
          issue_count=$(jq -er '.total | numbers' <<<"$issues")
          if [[ "$issue_count" -ne 0 ]]; then
            echo "::error::SonarCloud reported $issue_count unresolved finding(s); the check requires zero."
            exit 1
          fi

          measures=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" --get \
            'https://sonarcloud.io/api/measures/component' \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode 'metricKeys=duplicated_lines_density' "${scope[@]}")
          duplicate_percent=$(jq -er '.component.measures[] | select(.metric == "duplicated_lines_density") | .value' <<<"$measures")
          if ! awk -v value="$duplicate_percent" 'BEGIN { exit !(value < 3) }'; then
            echo "::error::SonarCloud duplication is ${duplicate_percent}%; it must be below 3%."
            exit 1
          fi
          echo "SonarCloud policy passed: no unresolved findings and ${duplicate_percent}% duplication."

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Code analysis
        id: snyk_code
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Scan published package dependencies with Snyk
        id: snyk_dependencies
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=package-lock.json

      - name: Set up Java for Checkstyle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-provider: basic

      - name: Run Checkstyle
        id: checkstyle
        continue-on-error: true
        run: gradle --no-daemon checkstyleMain

      - name: Require all three quality checks to pass
        if: always()
        env:
          SONAR_SCAN_RESULT: ${{ steps.sonar_scan.outcome }}
          SONAR_POLICY_RESULT: ${{ steps.sonar_policy.outcome }}
          SNYK_CODE_RESULT: ${{ steps.snyk_code.outcome }}
          SNYK_DEPENDENCIES_RESULT: ${{ steps.snyk_dependencies.outcome }}
          CHECKSTYLE_RESULT: ${{ steps.checkstyle.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for check in \
            "Sonar scan=$SONAR_SCAN_RESULT" \
            "Sonar findings/duplication=$SONAR_POLICY_RESULT" \
            "Snyk Code=$SNYK_CODE_RESULT" \
            "Snyk dependencies=$SNYK_DEPENDENCIES_RESULT" \
            "Checkstyle=$CHECKSTYLE_RESULT"; do
            echo "$check"
            if [[ "$check" != *=success ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo '::error::The consolidated quality-gates stage requires SonarCloud, Snyk, and Checkstyle to pass.'
            exit 1
          fi
